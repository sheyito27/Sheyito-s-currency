plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.170'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    // Only used for the compileOnly FTB Quests/Architectury soft-dependency below - the mod
    // never requires either of these to be present at runtime.
    maven { url = "https://maven.ftb.dev/releases" }
    maven { url = "https://maven.architectury.dev" }
    // Only used for the compileOnly Waystones/Balm soft-dependency below - never required at runtime.
    maven {
        url = "https://maven.twelveiterations.com/repository/maven-public/"
        content { includeGroup "net.blay09.mods" }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Default run configurations.
runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    // Extra dev clients for local multiplayer testing (features like the liquidation vote need
    // 2+ voters online besides the victim). runClient always logs in as NeoGradle's "Dev"
    // placeholder - these fix a distinct --username instead, so each one is a stable, separate
    // player (runs/server has online-mode=false, so any username connects with no real account).
    // Names don't match a built-in run type, so runType points them at the client type explicitly.
    client2 {
        runType 'client'
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        arguments '--username', 'Tester2', '--quickPlayMultiplayer', 'localhost:25565'
    }

    client3 {
        runType 'client'
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        arguments '--username', 'Tester3', '--quickPlayMultiplayer', 'localhost:25565'
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Soft-dependency only (compileOnly, never implementation): lets FtbQuestsIntegration
    // compile against FTB Quests' ObjectCompletedEvent.QUEST so every finished quest can pay
    // out automatically, with zero per-quest setup in the pack. Never packaged into our jar
    // and never required at runtime - gated behind ModList.get().isLoaded("ftbquests") in
    // FTBQuestsCompat, so the mod works identically with or without FTB Quests installed.
    compileOnly "dev.ftb.mods:ftb-quests-neoforge:2101.1.30"
    compileOnly "dev.architectury:architectury-neoforge:13.0.8"

    // Soft-dependency only (compileOnly, never implementation): lets WaystonesIntegration compile
    // against Waystones' WaystoneTeleportEvent so using a waystone costs a configurable toll.
    // balm-common is required too because that event extends Balm's BalmEvent and registration
    // goes through Balm.getEvents(). Never packaged into our jar and never required at runtime -
    // gated behind ModList.get().isLoaded("waystones") in WaystonesCompat.
    compileOnly "net.blay09.mods:waystones-common:21.1.41+1.21.1"
    compileOnly "net.blay09.mods:balm-common:21.0.65+1.21.1"

    // Soft-dependency only (compileOnly, never implementation): lets FtbChunksIntegration compile
    // against FTB Chunks' ClaimedChunkEvent (Architectury-based, same system FTB Quests uses -
    // architectury-neoforge above is shared) so reclaiming a chunk costs a one-time charge.
    // ftb-library-neoforge is required too because ClaimResult imports its NameMap class. Never
    // packaged into our jar and never required at runtime - gated behind
    // ModList.get().isLoaded("ftbchunks") in FTBChunksCompat.
    compileOnly "dev.ftb.mods:ftb-chunks-neoforge:2101.1.21"
    compileOnly "dev.ftb.mods:ftb-library-neoforge:2101.1.35"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // Unit tests bootstrap vanilla's own registries (Items, Blocks, ...) directly via
    // net.minecraft.server.Bootstrap - no running game/server needed for that, but it does
    // need to run as an "opened" JVM the same way the game itself does.
    jvmArgs += [
            '--add-opens', 'java.base/java.util=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
    ]
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
